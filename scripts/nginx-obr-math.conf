limit_req_zone $binary_remote_addr zone=obr_api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=obr_conn:10m;
log_format obr_safe '$remote_addr - [$time_local] "$request_method $uri" $status $body_bytes_sent';
server {
 listen 80 default_server;
 server_name 43.163.203.127;
 server_tokens off;
 access_log /var/log/nginx/obr-access.log obr_safe;
 location /.well-known/acme-challenge/ { root /var/www/html; }
 location / { return 301 https://43.163.203.127$request_uri; }
}
server {
 listen 443 ssl default_server;
 server_name 43.163.203.127;
 ssl_certificate /etc/letsencrypt/live/obr-math-ip/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/obr-math-ip/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 ssl_session_tickets off;
 server_tokens off;
 client_max_body_size 16k;
 client_header_timeout 10s;
 client_body_timeout 10s;
 keepalive_timeout 15s;
 send_timeout 15s;
 limit_conn obr_conn 20;
 limit_conn_status 429;
 limit_req zone=obr_api burst=40 nodelay;
 limit_req_status 429;
 access_log /var/log/nginx/obr-access.log obr_safe;
 add_header Strict-Transport-Security "max-age=31536000" always;
 add_header Referrer-Policy "no-referrer" always;
 if ($host != "43.163.203.127") { return 444; }
 location = /api/v1/trading-mode {
  if ($request_method !~ ^(GET|HEAD|POST)$) { return 405; }
  proxy_pass http://127.0.0.1:8765;
  proxy_hide_header Server;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_connect_timeout 5s;
  proxy_read_timeout 30s;
 }
 location = /api/v1/paper-config {
  if ($request_method !~ ^(GET|HEAD|POST)$) { return 405; }
  proxy_pass http://127.0.0.1:8765;
  proxy_hide_header Server;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_connect_timeout 5s;
  proxy_read_timeout 30s;
 }
 location = /downloads/OBR-Math-0.5.0.apk {
  if ($request_method !~ ^(GET|HEAD)$) { return 405; }
  alias /var/www/obr-downloads/OBR-Math-0.5.0.apk;
  default_type application/vnd.android.package-archive;
  add_header Content-Disposition 'attachment; filename="OBR-Math-0.5.0.apk"';
  add_header X-Content-Type-Options nosniff;
 }
 location = /downloads/OBR-Math-0.5.0-debug.apk {
  if ($request_method !~ ^(GET|HEAD)$) { return 405; }
  alias /var/www/obr-downloads/OBR-Math-0.5.0-debug.apk;
  default_type application/vnd.android.package-archive;
  add_header Content-Disposition 'attachment; filename="OBR-Math-0.5.0-debug.apk"';
  add_header X-Content-Type-Options nosniff;
 }
 location ~ "^/(?:$|healthz$|static/(?:app\.js|style\.css)$|api/v1/(?:status|metrics|signals|outcomes|universe|positions|alerts|fees|demo|reports(?:/\d{4}-\d{2}-\d{2})?)$)" {
  if ($request_method !~ ^(GET|HEAD)$) { return 405; }
  proxy_pass http://127.0.0.1:8765;
  proxy_hide_header Server;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_connect_timeout 5s;
  proxy_read_timeout 30s;
 }
 location / { return 404; }
}
